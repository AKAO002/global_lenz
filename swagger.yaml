openapi: 3.0.0
info:
  title: Global Lens
  description: |
    ビジネスパーソンのための多角的ニュース分析アプリ。
    5メディアのAI比較・要約、AI生成による用語解説、実用リンクを提供します。
  version: 1.4.0

servers:
  - url: https://api.globallens.example.com/v1

paths:
  # --- FR-001: トピック一覧 & FR-004: 話のネタおすすめ度 ---
  /topics:
    get:
      summary: トピック一覧とおすすめ度の取得
      description: |
        ホーム画面用。トピックリストと、それに紐づくメディア別「おすすめ度」を一括取得します。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicSummary'

  # --- FR-004, 005, 006, 008: 詳細データ一式（用語解説含む） ---
  /topics/{topicId}/analysis:
    get:
      summary: 比較要約・各国要約詳細・用語解説の取得
      description: |
        選択されたトピックの「比較要約」「主張のバラつき度」「各国要約（短・長）」
        およびAIが生成しDBに保存された「用語解説」をまとめて取得します。
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicAnalysis'

  # --- FR-007: ネタ帳リスト ---
  /users/me/bookmarks:
    get:
      summary: ネタ帳リストの取得
      description: 保存したトピックの一覧。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookmarkItem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ホーム画面用：トピックと連動する★の数
    TopicSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: "イランのイスラエル攻撃" }
        category: { type: string, example: "情勢" }
        date: { type: string, format: date, example: "2026-04-08" }
        mediaRatings:
          type: object
          description: "FR-004: 話のネタおすすめ度（★1〜5）"
          properties:
            NHK: { type: integer, example: 3 }
            CNN: { type: integer, example: 4 }
            BBC: { type: integer, example: 4 }
            AlJazeera: { type: integer, example: 5 }
            DDNews: { type: integer, example: 3 }

    # 詳細画面用：要約と比較指標 ＋ 用語解説
    TopicAnalysis:
      type: object
      properties:
        id: { type: string }
        totalVarianceScore: { type: integer, description: "FR-005: 主張のバラつき度（★1〜5）" }
        comparisonSummary: { type: string, description: "FR-005: 5メディアの比較要約" }
        mediaDetails:
          type: array
          items:
            type: object
            properties:
              mediaName: { type: string }
              summaryShort: { type: string, description: "FR-004: 各国要約（100文字）" }
              summaryFull: { type: string, description: "FR-006: 各国要約詳細（全文）" }
              sourceUrl: { type: string, description: "元記事へのURL" }
        # --- FR-008修正分: AI生成の用語解説リスト ---
        glossary:
          type: array
          description: "AIが要約時に生成しDBに保存した用語解説"
          items:
            type: object
            properties:
              term: { type: string, example: "ホルムズ海峡" }
              explanation: { type: string, example: "ペルシャ湾とオマーン湾を結ぶ要衝。世界の原油輸送の約2割が通過する。" }

    # ネタ帳用：○×表示対応
    BookmarkItem:
      type: object
      properties:
        topicId: { type: string }
        topicTitle: { type: string }
        deliveryDate: { type: string, example: "4月3日(金)" }
        hasCountrySummary: { type: boolean, description: "各国要約の登録有無" }
        hasComparisonSummary: { type: boolean, description: "比較要約の登録有無" }